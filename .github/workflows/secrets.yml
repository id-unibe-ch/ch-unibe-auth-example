name: Fill Key Vault

# Copies the providers' client secrets from the GitHub secrets into the Key Vault.
# Empty or unset GitHub secrets are skipped. The app is restarted afterwards so it picks up
# the new values.
#
# The Key Vault guardrail policy requires an expiry date and a content type on every secret.
# The expiry date is also the reminder to renew the secret at the provider.
on:
  workflow_dispatch:
    inputs:
      expires_in_months:
        description: 'Validity of the secrets in the Key Vault in months (no longer than at the provider)'
        type: number
        default: 12
      restart_app:
        description: 'Restart the app afterwards'
        type: boolean
        default: true

permissions:
  id-token: write # OIDC federation, no Azure secret in GitHub
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set the secrets
        env:
          # GitHub secret → Key Vault secret (names as in infra/main.bicepparam).
          # GitHub allows no secret names starting with GITHUB_, hence OAUTH_GITHUB_CLIENT_SECRET.
          ENTRA_UNIBE_CLIENT_SECRET: ${{ secrets.ENTRA_UNIBE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          EXTERNAL_ID_CLIENT_SECRET: ${{ secrets.EXTERNAL_ID_CLIENT_SECRET }}
          SWITCH_CLIENT_SECRET: ${{ secrets.SWITCH_CLIENT_SECRET }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          AGOV_CLIENT_SECRET: ${{ secrets.AGOV_CLIENT_SECRET }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          MONTHS: ${{ inputs.expires_in_months }}
        run: |
          set -euo pipefail
          vault="${KEY_VAULT_NAME:-}"
          if [ -z "$vault" ]; then
            vault=$(az keyvault list -g "$RG" --query "[?starts_with(name, 'kv-authex')].name | [0]" -o tsv)
          fi
          [ -n "$vault" ] || { echo "::error::No Key Vault found in $RG"; exit 1; }
          expires=$(date -u -d "+${MONTHS} months" +%Y-%m-%dT%H:%M:%SZ)
          echo "Key Vault: $vault · valid until $expires"

          declare -A map=(
            [ENTRA_UNIBE_CLIENT_SECRET]=entra-unibe-client-secret
            [MICROSOFT_CLIENT_SECRET]=microsoft-client-secret
            [EXTERNAL_ID_CLIENT_SECRET]=external-id-client-secret
            [SWITCH_CLIENT_SECRET]=switch-client-secret
            [ORCID_CLIENT_SECRET]=orcid-client-secret
            [GOOGLE_CLIENT_SECRET]=google-client-secret
            [OAUTH_GITHUB_CLIENT_SECRET]=github-client-secret
            [AGOV_CLIENT_SECRET]=agov-client-secret
          )

          # Pass the value through a file, not as a command-line argument.
          tmp=$(mktemp -p "$RUNNER_TEMP")
          trap 'rm -f "$tmp"' EXIT
          count=0
          for var in "${!map[@]}"; do
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "– $var not set, skipped"
              continue
            fi
            printf '%s' "$value" > "$tmp"
            az keyvault secret set --vault-name "$vault" --name "${map[$var]}" --file "$tmp" --encoding utf-8 \
              --expires "$expires" --content-type "OAuth client secret" --only-show-errors -o none
            echo "✔ ${map[$var]}"
            count=$((count + 1))
          done
          echo "$count secret(s) set."

      - name: Restart the app
        if: inputs.restart_app
        # The Container App reads Key Vault secrets when its replicas start.
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! revision=$(az containerapp show -g "$RG" -n ca-authex --query properties.latestRevisionName -o tsv 2>/dev/null); then
            echo "No Container App yet – no restart needed."; exit 0
          fi
          az containerapp revision restart -g "$RG" -n ca-authex --revision "$revision" --only-show-errors -o none
          echo "Revision $revision restarted."
