name: Key Vault befüllen

# Überträgt die Client Secrets der Anbieter aus den GitHub-Secrets in den Key Vault.
# Leere bzw. nicht gesetzte GitHub-Secrets werden übersprungen. Danach wird die App neu gestartet,
# damit sie die neuen Werte übernimmt.
#
# Die Guardrail-Policy für Key Vaults verlangt pro Secret ein Ablaufdatum und einen Content-Type.
# Das Ablaufdatum ist zugleich die Erinnerung, das Secret beim Anbieter zu erneuern.
on:
  workflow_dispatch:
    inputs:
      expires_in_months:
        description: 'Gültigkeit der Secrets im Key Vault in Monaten (nicht länger als beim Anbieter)'
        type: number
        default: 12
      restart_app:
        description: 'App danach neu starten'
        type: boolean
        default: true

permissions:
  id-token: write # OIDC-Federation, kein Azure-Secret in GitHub
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
    steps:
      - name: Bei Azure anmelden
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Secrets setzen
        env:
          # GitHub-Secret → Key-Vault-Secret (Namen wie in infra/main.bicepparam).
          # GitHub erlaubt keine Secret-Namen mit dem Präfix GITHUB_, daher OAUTH_GITHUB_CLIENT_SECRET.
          ENTRA_UNIBE_CLIENT_SECRET: ${{ secrets.ENTRA_UNIBE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          EXTERNAL_ID_CLIENT_SECRET: ${{ secrets.EXTERNAL_ID_CLIENT_SECRET }}
          SWITCH_CLIENT_SECRET: ${{ secrets.SWITCH_CLIENT_SECRET }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          AGOV_CLIENT_SECRET: ${{ secrets.AGOV_CLIENT_SECRET }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          MONTHS: ${{ inputs.expires_in_months }}
        run: |
          set -euo pipefail
          vault="${KEY_VAULT_NAME:-}"
          if [ -z "$vault" ]; then
            vault=$(az keyvault list -g "$RG" --query "[?starts_with(name, 'kv-authex')].name | [0]" -o tsv)
          fi
          [ -n "$vault" ] || { echo "::error::Kein Key Vault in $RG gefunden"; exit 1; }
          expires=$(date -u -d "+${MONTHS} months" +%Y-%m-%dT%H:%M:%SZ)
          echo "Key Vault: $vault · gültig bis $expires"

          declare -A map=(
            [ENTRA_UNIBE_CLIENT_SECRET]=entra-unibe-client-secret
            [MICROSOFT_CLIENT_SECRET]=microsoft-client-secret
            [EXTERNAL_ID_CLIENT_SECRET]=external-id-client-secret
            [SWITCH_CLIENT_SECRET]=switch-client-secret
            [ORCID_CLIENT_SECRET]=orcid-client-secret
            [GOOGLE_CLIENT_SECRET]=google-client-secret
            [OAUTH_GITHUB_CLIENT_SECRET]=github-client-secret
            [AGOV_CLIENT_SECRET]=agov-client-secret
          )

          # Wert über eine Datei übergeben, nicht als Kommandozeilenargument.
          tmp=$(mktemp -p "$RUNNER_TEMP")
          trap 'rm -f "$tmp"' EXIT
          count=0
          for var in "${!map[@]}"; do
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "– $var nicht gesetzt, übersprungen"
              continue
            fi
            printf '%s' "$value" > "$tmp"
            az keyvault secret set --vault-name "$vault" --name "${map[$var]}" --file "$tmp" --encoding utf-8 \
              --expires "$expires" --content-type "OAuth client secret" --only-show-errors -o none
            echo "✔ ${map[$var]}"
            count=$((count + 1))
          done
          echo "$count Secret(s) gesetzt."

      - name: App neu starten
        if: inputs.restart_app
        # Die Container App liest Key-Vault-Secrets beim Start der Replikate.
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! revision=$(az containerapp show -g "$RG" -n ca-authex --query properties.latestRevisionName -o tsv 2>/dev/null); then
            echo "Noch keine Container App – kein Neustart nötig."; exit 0
          fi
          az containerapp revision restart -g "$RG" -n ca-authex --revision "$revision" --only-show-errors -o none
          echo "Revision $revision neu gestartet."
